name: security-scan

# Five responsibilities:
#   smoke               — fast offline check on every PR / push to master
#   refresh-hashes      — weekly cron, opens PR with (incl. availability
#                         evidence: gone / yanked / relocated packages):
#                           1. refreshed integrity hashes (verify_integrity --update)
#                           2. refreshed GitHub metrics + recalculated health scores
#                              (refresh_scores --write)
#                         Human review — version bumps may carry CVE fixes OR a
#                         freshly compromised release.
#   docker-drift        — weekly + manual, fails on any pinned-digest drift.
#   discover-candidates — weekly cron, opens PR with fresh
#                         assets/discovery/candidates.json. Pure inbox for triage;
#                         the DB stays the deterministic source of truth.
#   mcp-eval-smoke      — weekly + manual, spawns each DB entry's MCP server,
#                         runs handshake + tools/list + schema lint, uploads
#                         eval_results.json as an artifact (no auto-commit).
#                         Needs network (npx/uvx package fetch); --sandbox, so
#                         third-party code never runs on the host. Cron-only.
#
# The sixth used to live here: `mcp-eval-pr`, the per-PR behavioural smoke. It
# now has its own file (.github/workflows/mcp-eval-pr.yml), because it checks
# out the PR head and this workflow also runs on `schedule` and
# `workflow_dispatch` — an `if:` kept the two apart, but only a reader who
# noticed it. A file that can only start from `pull_request` needs no such
# notice. (That also makes the count above true again.)
#
# Isolation model. GitHub-hosted runners don't start on this account (billing
# lock, see runner-health.yml), so everything lands on one self-hosted macOS
# machine and isolation has to happen inside it:
#   - PR-authored code (tests, scripts) runs in a container: no network, repo
#     mounted read-only, no capabilities, no docker socket.
#   - PR-authored *data* (tools_database.json) is evaluated by base-commit code,
#     and every docker launch is rebuilt from its pinned digest, so a hostile
#     install_cmd cannot smuggle flags onto the host.
#   - Third-party MCP servers always run under --sandbox, never --unsafe.
# tests/ci_manifest.test.cjs asserts these properties so they can't quietly
# regress in a later one-line edit.

on:
  pull_request:
    paths:
      - 'mcp-ecosystem-intelligence/assets/tools_database.json'
      - 'mcp-ecosystem-intelligence/scripts/**'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'   # refresh-hashes + docker-drift — Mondays 06:17 UTC
    - cron: '23 6 * * 4'   # discover-candidates — Thursdays 06:23 UTC (separate day from Monday jobs)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (node:test)
    # GitHub-hosted runners do not start on this account (billing lock — see
    # runner-health.yml), so every job lands on the self-hosted machine and the
    # isolation has to happen inside it. A pull_request build runs code the PR
    # author wrote: `node --test tests/*.test.cjs` executes whatever landed in
    # tests/. For those builds the suite runs in a container with no network, a
    # read-only copy of the repo, no capabilities and no access to the runner's
    # home directory or docker socket. Trusted contexts (push, cron) run
    # directly, because the code is ours.
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      # The PR path needs a container to isolate PR-authored code. If no
      # runtime answers, the honest outcome is "not checked" — running the
      # suite on the host instead would quietly drop the isolation exactly when
      # nobody is looking.
      - name: Docker preflight
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-preflight
        with:
          required: 'true'
      - name: node --test
        env:
          # Pinned by digest, like everything else this project consumes.
          JAIL_IMAGE: node:22-alpine
        # Bash expands the glob into a file list before node sees it;
        # node --test in Node 20 doesn't glob-expand quoted patterns itself.
        # The run is teed to RUNNER_TEMP so the next step can read the count
        # without executing anything: a second `node --test` would double the
        # runtime and, on a PR, would be a second unjailed execution of PR code.
        # `pipefail` is set, so tee cannot mask a failing suite.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pull_request build — running the suite in a jailed container"
            docker run --rm --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              --memory 2g --pids-limit 512 \
              -v "$PWD":/w:ro -w /w "$JAIL_IMAGE" \
              node --test tests/*.test.cjs | tee "$RUNNER_TEMP/test-output.txt"
          else
            node --test tests/*.test.cjs | tee "$RUNNER_TEMP/test-output.txt"
          fi
      # The test count is on the README badge, and tests/docs_numbers.test.cjs
      # cannot check it: counting `test(` calls statically misses the 30 that
      # are generated in loops, and running the suite inside the suite is not a
      # thing to do. So it is read out of the run that just happened — this step
      # executes no repository code, only `sed` over two files. Advisory: a
      # stale badge is a documentation bug, not a reason to fail a green build.
      - name: README test badge matches the suite
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          # Two reporters, two prefixes: `node --test` prints "ℹ pass 675" by
          # default and "# pass 675" under TAP. Matching only the TAP form
          # silently produced "unknown" and compared nothing.
          count=$(grep -oE '(^#|ℹ) pass [0-9]+' "$RUNNER_TEMP/test-output.txt" | grep -oE '[0-9]+' | tail -1)
          badge=$(sed -n 's/.*badge\/tests-\([0-9]*\)%20pass.*/\1/p' README.md | head -1)
          echo "suite: ${count:-unknown} | badge: ${badge:-none}"
          if [ -n "${count:-}" ] && [ "${count}" != "${badge}" ]; then
            echo "::warning file=README.md::the tests badge says ${badge}, the suite has ${count}"
            {
              echo "## Tests badge"
              echo
              echo "README says **${badge}**, the suite ran **${count}**. Update the badge in README.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  smoke:
    name: Verify seeded DB (offline)
    runs-on: self-hosted
    timeout-minutes: 15
    needs: unit-tests
    permissions:
      contents: read
      security-events: write   # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      - name: Docker preflight
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/docker-preflight
        with:
          required: 'true'
      - name: verify_integrity --offline
        env:
          JAIL_IMAGE: node:22-alpine
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker run --rm --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              -v "$PWD":/w:ro -w /w "$JAIL_IMAGE" \
              node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --offline
          else
            node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --offline
          fi
      # Same run, machine-readable: each finding lands on the tools_database.json
      # line that caused it, so a PR that adds an entry with no pin gets the
      # annotation on that entry instead of a red check with prose in the log.
      - name: verify_integrity --sarif
        id: sarif
        if: always()
        env:
          JAIL_IMAGE: node:22-alpine
        # The redirect target is a fresh file under RUNNER_TEMP, never a path
        # inside the checkout. Redirecting to `./verify.sarif` ran on the host
        # and followed that path wherever it led — and a PR can commit
        # `verify.sarif` as a symlink to any file the runner user can write,
        # which `-v …:ro` does nothing about.
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/mcp-vault-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sarif"
          rm -f "$out"
          # Publish the path first. With `set -e` and the output written last, a
          # verifier exiting non-zero — a policy gate doing its job — skipped
          # the line, and the always() upload below got an empty path: the run
          # that most needed its findings published was the one that lost them.
          echo "path=$out" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker run --rm --network none \
              --cap-drop ALL --security-opt no-new-privileges \
              -v "$PWD":/w:ro -w /w "$JAIL_IMAGE" \
              node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --offline --sarif > "$out"
          else
            node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --offline --sarif > "$out"
          fi
      - name: Upload to code scanning
        if: always()
        continue-on-error: true   # code scanning may be off; never block the gate on it
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd   # v4.38.1
        with:
          sarif_file: ${{ steps.sarif.outputs.path }}
          category: mcp-vault-verify

  refresh-hashes:
    name: Weekly hash refresh PR
    # Run on Monday's cron and on manual dispatch — but NOT on Thursday's
    # discover-candidates cron (same workflow, different schedule).
    if: (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1') || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    # Every step here talks to the GitHub API — verify_integrity reads
    # GITHUB_TOKEN directly, refresh_scores shells out to `gh api`. Without
    # this the jobs fell back to whatever ambient auth the runner happened to
    # have: the maintainer's keyring-stored personal token, carrying `repo`,
    # `gist`, `user` and `workflow` scopes across every repo they own. A
    # supply-chain scanner should not run CI with that blast radius, and it
    # isn't reproducible either — a launchd-spawned runner can't reach the
    # login keychain, which is exactly how `refresh_scores --write` started
    # failing with "gh CLI not found or not authenticated".
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      - name: verify_integrity --update
        run: node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --update
      - name: Re-verify with refreshed hashes, recording dated evidence
        # --record-evidence writes per-dimension results with the date they were
        # established, so `trust` becomes derived rather than asserted. This job
        # is the right place for it: it is the one that talks to every feed.
        run: node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --deep --record-evidence
      - name: refresh_scores --write
        run: node mcp-ecosystem-intelligence/scripts/refresh_scores.cjs --write
      # Whether each entry is still published at all. This is the one question
      # the gate structurally cannot answer: a 404 and a network failure arrive
      # on the same code path, so both read as "could not check" and an entry
      # that npm had stopped serving kept its `trust: verified`. Exit 1 here
      # means something is gone or yanked, which belongs in the PR rather than
      # in a failed job — the evidence write is the useful output.
      - name: Availability + relocation check
        id: availability
        continue-on-error: true
        run: |
          node mcp-ecosystem-intelligence/scripts/check_availability.cjs --write --repos --json > /tmp/availability.json || true
          node -e '
            const r = require("/tmp/availability.json");
            const s = r.summary;
            const rows = r.entries.filter(e => ["gone","version-gone","yanked","deprecated"].includes(e.availability.state) || (e.identity && e.identity.state === "relocated"));
            const lines = [
              "## Availability",
              "",
              `${r.checked} entries — ${s.present} present, ${s.gone} gone, ${s.version_gone} version-gone, ${s.yanked} yanked, ${s.deprecated} deprecated, ${s.relocated} relocated, ${s.unknown} not checkable`,
              "",
            ];
            if (rows.length) {
              lines.push("| entry | state | detail |", "| --- | --- | --- |");
              for (const e of rows) {
                const state = e.availability.state === "present" ? e.identity.state : e.availability.state;
                const detail = (e.availability.detail || (e.identity && e.identity.detail) || "").replace(/\|/g, "\\|").slice(0, 160);
                lines.push(`| ${e.name} | ${state} | ${detail} |`);
              }
            } else {
              lines.push("Everything the DB pins is still published where it says it is.");
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Registry identity (official MCP registry)
        id: identity
        continue-on-error: true
        run: |
          node mcp-ecosystem-intelligence/scripts/check_identity.cjs --write --json > /tmp/identity.json || true
          node -e '
            const r = require("/tmp/identity.json");
            const s = r.summary;
            const rows = r.entries.filter((e) => ["contradicted", "withdrawn"].includes(e.registry.state));
            const lines = [
              "## Registry identity",
              "",
              `${r.checked} entries — ${s.listed} listed under an ownership-verified namespace, ${s.unlisted} not listed, ${s.contradicted} contradicted, ${s.withdrawn} withdrawn, ${s.unknown} not checkable.`,
              "",
              "Being unlisted is not a finding: listing is opt-in.",
              "",
            ];
            if (rows.length) {
              lines.push("| entry | state | finding |", "| --- | --- | --- |");
              for (const e of rows) lines.push(`| ${e.name} | ${e.registry.state} | ${(e.registry.findings[0] || "").replace(/\|/g, "\\|").slice(0, 160)} |`);
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Upstream repository posture (OpenSSF Scorecard)
        continue-on-error: true
        run: node mcp-ecosystem-intelligence/scripts/check_posture.cjs --write
      # Capability delta. Only versions this refresh has not scanned before are
      # fetched, so the cost tracks the version bumps rather than the DB size —
      # and the interesting output is the *diff* of assets/capabilities.json,
      # which is what lands in the PR.
      - name: Capability scan + delta
        id: capabilities
        continue-on-error: true
        run: |
          node mcp-ecosystem-intelligence/scripts/check_capabilities.cjs --write --json > /tmp/caps.json || true
          node -e '
            const r = require("/tmp/caps.json");
            const gained = (r.entries || []).filter((e) => e.delta && e.delta.added.length);
            const lines = ["## Capability delta", ""];
            if (!gained.length) {
              lines.push(`${r.scanned} package(s) scanned; none gained a capability since the version last recorded.`);
            } else {
              lines.push(`${gained.length} of ${r.scanned} scanned packages gained a capability:`, "");
              lines.push("| entry | version | gained | evidence |", "| --- | --- | --- | --- |");
              for (const e of gained) {
                for (const a of e.delta.added) {
                  const ev = (a.evidence[0] || {});
                  lines.push(`| ${e.name} | ${e.compared_with} → ${e.version} | ${a.high_risk ? `**${a.capability}**` : a.capability} | ${ev.file || ""}:${ev.line || "?"} |`);
                }
              }
              lines.push("", "A capability *found* is a fact; nothing here claims a package cannot do something. Bold = high risk (shell, dynamic code, credential paths, install scripts).");
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Safe upgrade paths for anything with an advisory
        continue-on-error: true
        run: |
          node mcp-ecosystem-intelligence/scripts/suggest_upgrade.cjs --json > /tmp/upgrade.json || true
          node -e '
            const r = require("/tmp/upgrade.json");
            const rows = (r.entries || []).filter((e) => ["upgrade", "no-fix"].includes(e.plan.state));
            const lines = ["## Advisories and the shortest safe version", ""];
            if (!rows.length) {
              lines.push(`${r.checked} entries — nothing known applies to any pinned version.`);
            } else {
              lines.push("| entry | pinned | clears at | advisories | latest |", "| --- | --- | --- | --- | --- |");
              for (const e of rows) {
                const p = e.plan;
                lines.push(`| ${e.name} | ${e.current} | ${p.target || "**no fix**"} | ${(p.advisories || []).map((a) => a.id).join(", ")} | ${p.latest || "?"} |`);
              }
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      # The `mcp-eval-pr` gate below can never see the PR this job opens:
      # GitHub doesn't trigger workflows for PRs created with GITHUB_TOKEN, so
      # `on: pull_request` never fires and the PR lands showing
      # mergeStateStatus=CLEAN — "no checks" reading as "checks passed". Smoke
      # the changed entries here instead, against HEAD, while the diff is still
      # in the working tree. Advisory (gate off): the maintainer reads the
      # table in this job's summary before merging.
      - name: Smoke the entries this refresh changed
        continue-on-error: true
        uses: ./.github/actions/smoke-changed-entries
        with:
          base: HEAD
          title: MCP eval (entries changed by this refresh)
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          commit-message: 'chore: weekly refresh of hashes + GitHub metrics'
          title: 'chore: weekly refresh of hashes + GitHub metrics'
          body: |
            Automated weekly refresh via:
            - `verify_integrity.cjs --update` — refreshes `version` + `pkg_integrity`
            - `verify_integrity.cjs --deep --record-evidence` — dated evidence per dimension
            - `refresh_scores.cjs --write` — refreshes `stars`, `last_commit_days`,
              `open_issues`, `health_score` from GitHub API
            - `check_availability.cjs --write` — gone / yanked / deprecated / relocated
            - `check_identity.cjs --write` — the official registry's ownership-verified listing
            - `check_posture.cjs --write` — OpenSSF Scorecard for the upstream repo
            - `check_capabilities.cjs --write` — what each package can do, and what it gained
            - `suggest_upgrade.cjs` — the shortest version that clears any advisory

            Read the job summary: it carries the availability, identity, capability-delta
            and upgrade tables for this run.

            ## Reviewer checklist
            - [ ] Diff each version bump against the package's CHANGELOG / GitHub releases
            - [ ] Look for unexplained major-version jumps (could indicate package hijack)
            - [ ] Confirm no entry switched maintainer / org silently
            - [ ] Check tier changes (Recommended → Experimental, etc.) — may need manual follow-up
            - [ ] Large star-count drops may indicate repo transfer or star-farming removal
            - [ ] Read the **Capability delta** table: a new `shell`, `dynamic_code`,
                  `credential_paths` or `install_script` in a patch release is the shape a
                  compromised release takes before it has a CVE
            - [ ] Read the **Availability** table in the job summary: `gone` / `version-gone`
                  / `yanked` entries have had their trust downgraded and need re-pinning or
                  removal; `relocated` means the registry now points somewhere else
            - [ ] Re-run `verify_integrity.cjs` locally — should exit 0

            > ⚠️ This PR is the **only** human gate between npm/PyPI publishing
            > a new version and our DB blessing it. Don't auto-merge.
          branch: chore/refresh-hashes
          delete-branch: true
          add-paths: |
            mcp-ecosystem-intelligence/assets/tools_database.json
            mcp-ecosystem-intelligence/assets/capabilities.json

  docker-drift:
    name: Docker @sha256 drift
    # Drift = upstream rebuilt the tracked tag under a new digest. May be a
    # routine rebuild, may be a hijack — surface and let a human decide.
    # Not part of `smoke` because it hits the network; runs alongside the
    # Monday refresh and on manual dispatch.
    if: (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1') || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: write        # the refreshed pins land on a branch
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      # --write turns the drift into a diff. A red job says "something moved";
      # a pull request says what moved, from which digest to which, with a link
      # to the upstream releases page — which is what a human needs to tell a
      # routine rebuild from a hijack. Errors still fail the job: an unreachable
      # registry means nothing was compared.
      - name: check_docker_drift --write
        id: drift
        # Trusted context only (cron / manual dispatch), so writing inside the
        # checkout is fine here — unlike the PR path above.
        run: |
          set -o pipefail
          node mcp-ecosystem-intelligence/scripts/check_docker_drift.cjs --write --json | tee drift.json
          drifts=$(node -e "console.log(JSON.parse(require('fs').readFileSync('drift.json','utf8')).drifts)")
          updated=$(node -e "console.log(JSON.parse(require('fs').readFileSync('drift.json','utf8')).updated.length)")
          echo "drifts=$drifts"   >> "$GITHUB_OUTPUT"
          echo "updated=$updated" >> "$GITHUB_OUTPUT"
          {
            echo "## Docker drift check"
            echo
            echo "Drifts: **$drifts** · pins updated: **$updated**"
            echo
            echo '```json'
            cat drift.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Prove the new pins before asking anyone to look at them: --deep hashes
      # the manifest the registry serves and compares it with what we just wrote.
      - name: Re-verify the refreshed pins
        if: steps.drift.outputs.updated != '0'
        run: node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --deep --no-audit
      - name: Open a PR with the refreshed digests
        if: steps.drift.outputs.updated != '0'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          commit-message: 'chore(docker): refresh drifted image digests'
          title: 'chore(docker): refresh drifted image digests'
          body: |
            Upstream rebuilt one or more tracked tags, so the pinned digests no
            longer match what the registry serves. This PR moves the pins.

            The digest lives in two places per docker entry — inside
            `install_cmd` and in `pkg_integrity` — and both moved together.
            `verify_integrity --deep` re-ran against the new pins and passed,
            so the manifest the registry serves hashes to the digest recorded
            here.

            ## Reviewer checklist
            - [ ] Open the upstream releases page for each image (linked in the job summary) and confirm a release explains the rebuild
            - [ ] A rebuild with no matching release is the interesting case — a hijack looks exactly like a routine rebuild from here
            - [ ] Confirm the image is still published by the same org
            - [ ] Confirm `tracked_tag` is still the tag you mean to follow

            > A rebuilt tag is routine. This PR exists so "routine" is a
            > judgement someone made, not an assumption the tooling made.
          branch: chore/docker-digest-refresh
          delete-branch: true
          add-paths: |
            mcp-ecosystem-intelligence/assets/tools_database.json

  license-drift:
    name: Weekly license-drift check
    # OSI → source-available relicensing (HashiCorp/Elastic/MongoDB/Redis pattern).
    # The existing health-score updater quietly drops -10 for non-OSI licenses,
    # which is the wrong volume for a relicensing event — we want a loud CI
    # failure that forces a human to acknowledge.
    #
    # Network-bound (npm view + pypi.org + gh api); skip on PRs to avoid
    # rate-limit churn, run on Monday's cron + manual dispatch alongside
    # the other weekly jobs. Failure is the signal — no auto-PR.
    if: (github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1') || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      - name: check_license_drift --strict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          node mcp-ecosystem-intelligence/scripts/check_license_drift.cjs --json | tee license-drift.json
          {
            echo "## License-drift check"
            echo
            echo '```json'
            cat license-drift.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # --strict separately so the JSON dump above always lands in the summary
          node mcp-ecosystem-intelligence/scripts/check_license_drift.cjs --strict

  discover-candidates:
    name: Weekly candidates PR
    # Pure inbox refresh: re-runs discover.cjs against modelcontextprotocol/servers
    # README + npm search + gh topic search, deduplicates against the live DB,
    # writes assets/discovery/candidates.json. Opens a PR so a human can cherry-pick
    # entries into tools_database.json with `trust: candidate`. Never auto-merges —
    # discover.cjs has no taste filter.
    if: (github.event_name == 'schedule' && github.event.schedule == '23 6 * * 4') || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      - name: discover.cjs (readme + npm + gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mcp-ecosystem-intelligence/assets/discovery
          node mcp-ecosystem-intelligence/scripts/discover.cjs \
            --source readme,npm,gh \
            --limit 50 \
            --max-health-checks 200 \
            --out mcp-ecosystem-intelligence/assets/discovery/candidates.json
      - name: Summary
        run: |
          {
            echo "## Discovery summary"
            echo
            node -e "
              const j = require('./mcp-ecosystem-intelligence/assets/discovery/candidates.json');
              console.log('- generated_at: ' + j.generated_at);
              console.log('- sources: ' + j.sources.join(', '));
              console.log('- raw_count: ' + j.raw_count);
              console.log('- kept_count: ' + j.kept_count);
              console.log('- rejected_count: ' + j.rejected_count);
              console.log();
              console.log('### Top 10');
              console.log();
              console.log('| name | score | license |');
              console.log('|---|---|---|');
              for (const c of j.candidates.slice(0, 10)) {
                console.log(\`| \${c.name} | \${c.health_score} | \${c.license} |\`);
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          commit-message: 'chore(discovery): weekly candidates refresh'
          title: 'chore(discovery): weekly candidates refresh'
          body: |
            Automated weekly refresh of `assets/discovery/candidates.json` via
            `discover.cjs --source readme,npm,gh`.

            This file is an **inbox**, not part of the DB. Nothing here is trusted
            until a human cherry-picks it into `tools_database.json` with
            `trust: "candidate"` and the next `verify_integrity.cjs --update` run
            populates `version` + `pkg_integrity`.

            ## Reviewer checklist
            - [ ] Skim top entries — anything that obviously isn't an MCP server (SDK, CLI, demo)
            - [ ] Cross-check duplicates that may differ by repo URL only
            - [ ] For high-score (≥85) entries: open the repo, confirm it ships a `ListTools` handler
            - [ ] Add `category` and `est_tools_count` when promoting to `tools_database.json`
            - [ ] Apply §6 reject heuristics (5-Minute Rule, Bloat, Duplication) — discover.cjs has no taste

            > Living artifact. Never auto-merge — DB stays the deterministic source of truth.
          branch: chore/discover-candidates
          delete-branch: true
          add-paths: |
            mcp-ecosystem-intelligence/assets/discovery/candidates.json

  mcp-eval-smoke:
    name: MCP eval smoke (behavioural)
    # Spawns each DB entry, runs initialize → tools/list, lints schemas.
    # Needs network to fetch npx packages / uvx wheels / docker images,
    # so PR triggers are explicitly excluded — cron only. The eval
    # results.json is uploaded as an artifact; humans review and decide
    # whether to update the DB. Nothing here writes to the DB.
    if: github.event_name != 'pull_request' && ((github.event_name == 'schedule' && github.event.schedule == '17 6 * * 1') || github.event_name == 'workflow_dispatch')
    needs: unit-tests
    permissions:
      contents: write        # the snapshot lands on a branch
      pull-requests: write
    # This job downloads and runs 100+ third-party MCP servers. A verified hash
    # says which artifact ran, not that it was benign — this project's own
    # SECURITY.md says so. It used to run `--unsafe` directly on this machine
    # because the runner was "trusted"; the runner being trusted says nothing
    # about the 100+ packages. It now runs `--sandbox`, so each server starts in
    # a container with no capabilities, a read-only rootfs, a non-root user and
    # memory/pid caps. `--unsafe` on a long-lived machine is the one mode this
    # project should never use on code it did not write.
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: '20'
      # No uv on the host any more: with --sandbox the uvx entries run inside
      # ghcr.io/astral-sh/uv, which ships it. The step this replaces was
      # `curl -LsSf https://astral.sh/uv/install.sh | sh`, in a tool whose pitch
      # is that installing an MCP server stops feeling like curl | bash.
      - name: Docker preflight
        uses: ./.github/actions/docker-preflight
        with:
          required: 'true'
      - name: mcp_eval --json
        # Long timeout per entry — npx cold-fetches can take 20–30s in CI;
        # the script's per-entry timeout (default 30s) is the inner gate.
        # --pace: a gap between container starts. Without one, 113 back-to-back
        # `docker run`s took the daemon down on a developer laptop and every
        # entry after that was reported as a crashed server.
        run: node mcp-ecosystem-intelligence/scripts/mcp_eval.cjs --sandbox --pace 750 --json > eval_results_run.json
      - name: Summary
        if: always()
        run: |
          {
            echo "## MCP eval smoke"
            echo
            node -e "
              const j = require('./eval_results_run.json');
              console.log('- checked: ' + j.checked);
              console.log('- pass:    ' + j.pass);
              console.log('- fail:    ' + j.fail);
              console.log('- skip:    ' + j.skip);
              console.log();
              const fails = (j.results || []).filter(r => r.status === 'fail');
              if (fails.length) {
                console.log('### Failures');
                console.log();
                for (const r of fails) console.log('- ' + r.name + ' — ' + (r.error_code || 'unknown'));
              }
              const drifts = (j.results || []).filter(r => r.tool_count_drift);
              if (drifts.length) {
                console.log();
                console.log('### Tool-count drift');
                console.log();
                for (const r of drifts) console.log('- ' + r.name + ': DB=' + r.tool_count_db + ', server=' + r.tool_count);
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Tool-surface drift
        if: always()
        run: |
          node -e '
            const run = require("./eval_results_run.json");
            const drifted = (run.results || []).filter((r) => r.surface_drift);
            const unexplained = drifted.filter((r) => !r.surface_drift.artifact_changed);
            const lines = ["## Tool surface", ""];
            if (!drifted.length) {
              lines.push("No server changed the tools it exposes since the last run.");
            } else {
              const unknown = drifted.filter((r) => r.surface_drift.artifact_changed === null).length;
              lines.push(`${drifted.length} server(s) changed their tool surface; ${unexplained.length} did so with **no change to the artifact**`
                + `${unknown ? `, and ${unknown} could not be compared (no identity recorded in the previous snapshot)` : ""}.`, "");
              lines.push("| server | artifact | change |", "| --- | --- | --- |");
              for (const r of drifted) {
                const d = r.surface_drift;
                const artifact = d.artifact_changed === null ? "not comparable"
                  : (d.artifact_changed ? "changed too" : "**unchanged**");
                lines.push(`| ${r.name} | ${artifact} | ${d.lines.join("; ").replace(/\|/g, "\\|").slice(0, 160)} |`);
              }
              if (unexplained.length) {
                lines.push("", "> A different tool surface from the same pinned artifact is **unexplained**, not impossible: a re-resolved transitive dependency, a feature flag, credentials or a remote backend can all do it. It becomes a hard finding when the artifact bytes, the dependency closure (`mcp-vault lock`) and the launch contract are all identical and the surface still differs.");
              }
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: eval-results
          path: eval_results_run.json
          # The default 90-day retention filled this account's artifact quota,
          # and "Artifact storage quota has been hit" is what failed the run —
          # not the eval itself. A week is longer than anyone reads these.
          retention-days: 7
      # An artifact is operational evidence: it expires, and someone who clones
      # the repo or installs the package cannot see it. The shipped
      # eval_results.json was `results: []`, so the behavioural layer existed in
      # CI and nowhere a user could check. Commit it through a reviewed PR —
      # evidence, still not policy: nothing here promotes an entry.
      - name: Refresh the shipped eval snapshot
        if: always()
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const run = JSON.parse(fs.readFileSync("eval_results_run.json", "utf8"));
            const path = "mcp-ecosystem-intelligence/assets/eval_results.json";
            const prev = JSON.parse(fs.readFileSync(path, "utf8"));
            // Keep only the fields a reader needs; drop stderr tails, which can
            // carry paths and tokens from a failing server.
            const slim = (r) => ({
              name: r.name, status: r.status, error_code: r.error_code || null,
              failure_class: r.failure_class || null,
              tool_count: r.tool_count, tool_count_db: r.tool_count_db,
              tool_count_drift: r.tool_count_drift, tools_payload_bytes: r.tools_payload_bytes,
              boot_ms: r.boot_ms,
              // The tool surface, hashed per tool. This is the baseline the next
              // run diffs against, so dropping it here would mean a rug pull is
              // never visible. Hashes only: a tool description is
              // attacker-controlled text and must not land in this repository.
              surface: r.surface || null,
              surface_drift: r.surface_drift || null,
              // And the identity of what ran. Without it the next run cannot
              // tell whether a changed surface came with a changed artifact —
              // which is the entire question — and would report every drift as
              // explained by a version bump. Dropping this field once made the
              // feature useless while looking like it worked.
              identity: r.identity || null,
              // A count, under its own name: `schema_errors` is an array that
              // `mcp_eval --no-spawn` iterates, and turning it into a number
              // made that mode throw.
              schema_errors: r.schema_errors || [],
              schema_error_count: (r.schema_errors || []).length,
              sandboxed: r.sandboxed, checked_at: r.checked_at,
            });
            const byName = new Map((prev.results || []).map((r) => [r.name, r]));
            for (const r of (run.results || [])) byName.set(r.name, slim(r));
            fs.writeFileSync(path, JSON.stringify({
              $schema: prev.$schema || "describes shape; not enforced",
              generated_at: new Date().toISOString(),
              generator: run.generator || prev.generator || null,
              note: "Behavioural evidence, not policy. Nothing here promotes an entry; tools_database.json stays the source of truth.",
              results: [...byName.values()].sort((a, b) => a.name.localeCompare(b.name)),
            }, null, 2) + "\n");
          '
          git --no-pager diff --stat -- mcp-ecosystem-intelligence/assets/eval_results.json
      - name: Open a PR with the refreshed eval snapshot
        if: always()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
        with:
          commit-message: 'chore(eval): refresh behavioural snapshot'
          title: 'chore(eval): refresh behavioural snapshot'
          body: |
            Last-known behavioural state for the DB entries, from this week's
            sandboxed eval run.

            This is **evidence, not policy**: nothing here promotes or demotes an
            entry, and `tools_database.json` remains the source of truth. It is
            committed so that someone who clones the repo or installs the package
            can see whether each server was observed to start and list tools —
            which a CI artifact, expiring in a week, cannot tell them.

            ## Reviewer checklist
            - [ ] New `fail` entries: is it the server, or the environment (missing credentials read as a failure)?
            - [ ] `tool_count_drift`: upstream changed its tool surface — check whether `est_tools_count` should move
            - [ ] A server that went from pass to CRASH deserves a look before the next release
          branch: chore/eval-snapshot
          delete-branch: true
          add-paths: |
            mcp-ecosystem-intelligence/assets/eval_results.json
          # The default 90-day retention filled this account's artifact quota,
          # and "Artifact storage quota has been hit" is what failed the run —
          # not the eval itself. A week is longer than anyone reads these.
          retention-days: 7
