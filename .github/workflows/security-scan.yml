name: security-scan

# Two responsibilities:
#   smoke           — fast offline check on every PR / push to master
#   refresh-hashes  — weekly cron that opens a PR with refreshed integrity hashes
#
# refresh-hashes runs verify_integrity.cjs --update against live registries,
# so every refresh requires human review before merging — version bumps may
# carry CVE fixes OR a freshly compromised release. The PR is the gate.

on:
  pull_request:
    paths:
      - 'mcp-ecosystem-intelligence/assets/tools_database.json'
      - 'mcp-ecosystem-intelligence/scripts/**'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — odd minute to avoid the top-of-hour stampede
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: Verify seeded DB (offline)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify_integrity --no-audit
        run: node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --no-audit

  refresh-hashes:
    name: Weekly hash refresh PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: verify_integrity --update
        run: node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs --update
      - name: Re-verify with refreshed hashes
        run: node mcp-ecosystem-intelligence/scripts/verify_integrity.cjs
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: weekly refresh of integrity hashes'
          title: 'chore: weekly refresh of integrity hashes'
          body: |
            Automated refresh of `version` and `pkg_integrity` fields via
            `verify_integrity.cjs --update`.

            ## Reviewer checklist
            - [ ] Diff each version bump against the package's CHANGELOG / GitHub releases
            - [ ] Look for unexplained major-version jumps (could indicate package hijack)
            - [ ] Confirm no entry switched maintainer / org silently
            - [ ] Re-run `verify_integrity.cjs` locally — should exit 0

            > ⚠️ This PR is the **only** human gate between npm/PyPI publishing
            > a new version and our DB blessing it. Don't auto-merge.
          branch: chore/refresh-hashes
          delete-branch: true
          add-paths: |
            mcp-ecosystem-intelligence/assets/tools_database.json
