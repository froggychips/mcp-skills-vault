name: Smoke changed DB entries
description: >
  Behavioural smoke of the tools_database.json entries that changed against a
  given git ref, each in a jailed container, reported as a step summary table.

# Extracted so the PR gate and the weekly refresh job share one implementation.
# They used to be one job, which meant the weekly refresh PR — the PR that
# routinely changes install_cmd/version — got no behavioural check at all:
# GitHub does not trigger workflows for PRs opened with GITHUB_TOKEN, so
# `on: pull_request` never fires for it. Rather than mint a PAT just to make
# the trigger work, the refresh job now runs this smoke itself, before it
# opens the PR, while it still has the diff in hand.

inputs:
  base:
    description: git ref to diff the DB against (PR base sha, or HEAD for a fresh working tree)
    required: true
  title:
    description: heading for the step-summary section
    required: false
    default: MCP eval (sandboxed, changed entries)
  gate:
    description: >
      exit non-zero when a changed entry regressed against the base ref's
      eval_results.json (was PASS, now CRASH/FAIL/NO_TOOLS, or lost tools at
      the same version). Entries that were already failing do not trip it.
      Advisory by default — a maintainer reads the table and decides.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Determine changed DB entries
      shell: bash
      env:
        BASE_REF: ${{ inputs.base }}
      # Scratch files live under RUNNER_TEMP, not in the checkout: a path in a
      # working tree can be a symlink someone else chose.
      run: node mcp-ecosystem-intelligence/scripts/changed_entries.cjs --base "$BASE_REF" > "$RUNNER_TEMP/changed.txt"

    - name: Sandboxed smoke of changed entries
      shell: bash
      run: |
        : > "$RUNNER_TEMP/pr_eval.ndjson"
        if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then echo "No DB entry changes — nothing to smoke."; exit 0; fi
        while IFS= read -r name; do
          [ -z "$name" ] && continue
          echo "smoking $name (sandboxed)…"
          node mcp-ecosystem-intelligence/scripts/mcp_eval.cjs \
            --name "$name" --sandbox --json \
            --results "$RUNNER_TEMP/pr_results.json" >> "$RUNNER_TEMP/pr_eval.ndjson" || true
        done < "$RUNNER_TEMP/changed.txt"

    - name: Summary
      if: always()
      shell: bash
      env:
        BASE_REF: ${{ inputs.base }}
        SECTION_TITLE: ${{ inputs.title }}
        GATE: ${{ inputs.gate }}
      # Verdicts are relative to the base ref's eval_results.json: only an entry
      # that used to PASS and no longer does (or lost tools at the same version)
      # is breaking. One that never booted in the sandbox — it wants a token or
      # a kubeconfig — is still failing, and is reported rather than gated on.
      # Rows unchecked for want of a launcher are called out as "not a pass".
      run: |
        [ -s "$RUNNER_TEMP/pr_eval.ndjson" ] || { echo "no results to report"; exit 0; }
        gate=()
        if [ "$GATE" = "true" ]; then gate=(--gate); fi
        node mcp-ecosystem-intelligence/scripts/smoke_compare.cjs \
          --runs "$RUNNER_TEMP/pr_eval.ndjson" --base "$BASE_REF" \
          --title "$SECTION_TITLE" "${gate[@]}"
