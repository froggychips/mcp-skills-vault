version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      # init and analyze refuse to run at different versions ("Loaded a
      # configuration file for version X, but running version Y"), so every
      # github/codeql-action/* bump must land in a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
